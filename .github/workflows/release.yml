name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate version consistency
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          MANIFEST_VER=$(node -p "require('./manifest.dist.json').version")
          TAG_VER=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VER" != "$MANIFEST_VER" ] || [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "Version mismatch: package.json=$PKG_VER, manifest=$MANIFEST_VER, tag=$TAG_VER"
            exit 1
          fi
          echo "✅ All versions match: $PKG_VER"

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Build extension
        run: npm run build

      - name: Validate build artifacts
        run: |
          if [ ! -f "dist/manifest.json" ]; then
            echo "Error: dist/manifest.json not found"
            exit 1
          fi
          if [ ! -f "dist/content/content-script.js" ]; then
            echo "Error: dist/content/content-script.js not found"
            exit 1
          fi
          if [ ! -f "dist/popup/popup.js" ]; then
            echo "Error: dist/popup/popup.js not found"
            exit 1
          fi
          echo "✅ All required files present"

      - name: Create release zip
        run: |
          cd dist
          zip -r ../jira-plans-enhanced.zip .
          cd ..

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: jira-plans-enhanced.zip
          generate_release_notes: true
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          # Get access token
          TOKEN_RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Failed to get access token:"
            echo "$TOKEN_RESPONSE" | jq .
            exit 1
          fi

          # Check current item status
          echo "Checking current extension status..."
          STATUS_RESPONSE=$(curl -s \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID?projection=DRAFT")
          UPLOAD_STATE=$(echo "$STATUS_RESPONSE" | jq -r '.uploadState // "UNKNOWN"')
          echo "Current upload state: $UPLOAD_STATE"

          if [ "$UPLOAD_STATE" = "IN_REVIEW" ]; then
            echo "⚠️ Extension is currently IN_REVIEW — skipping upload (will publish after review completes)"
            exit 0
          fi

          # Upload new version
          echo "Uploading new version..."
          UPLOAD_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -X PUT \
            -T jira-plans-enhanced.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID")
          HTTP_STATUS=$(echo "$UPLOAD_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$UPLOAD_RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Upload response ($HTTP_STATUS):"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          UPLOAD_STATE=$(echo "$BODY" | jq -r '.uploadState // "UNKNOWN"')
          if [ "$UPLOAD_STATE" != "SUCCESS" ]; then
            echo "❌ Upload failed with state: $UPLOAD_STATE"
            echo "$BODY" | jq -r '.itemError[]?.error_detail // empty' 2>/dev/null
            exit 1
          fi

          # Publish
          echo "Publishing..."
          PUBLISH_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish")
          HTTP_STATUS=$(echo "$PUBLISH_RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$PUBLISH_RESPONSE" | sed '/HTTP_STATUS:/d')
          echo "Publish response ($HTTP_STATUS):"
          echo "$BODY" | jq . 2>/dev/null || echo "$BODY"

          STATUS=$(echo "$BODY" | jq -r '.status[0] // "UNKNOWN"')
          if [ "$STATUS" != "OK" ] && [ "$STATUS" != "PUBLISHED_WITH_FRICTION_WARNING" ]; then
            echo "❌ Publish failed with status: $STATUS"
            exit 1
          fi
          echo "✅ Published successfully"
